<!doctype html>
<!-- Source for /social-card.png (1200 × 630). Render with tools/render-social-card.js. Not deployed. Sample data only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Bricolage Grotesque"; src: url("../assets/fonts/bricolage-grotesque-latin-wght-normal.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Instrument Sans"; src: url("../assets/fonts/instrument-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "IBM Plex Mono"; src: url("../assets/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0b1b21; color: #e2eeec; font-family: "Instrument Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 540px 1fr; align-items: center; gap: 48px; padding: 0 60px 0 72px;
    background:
      radial-gradient(700px 480px at 82% 55%, rgba(93, 182, 210, .2), transparent 70%),
      repeating-linear-gradient(to bottom, transparent 0 47px, rgba(93, 182, 210, .07) 47px 48px),
      #0b1b21; }
  .brand { display: flex; align-items: center; gap: 14px; font: 700 36px/1 "Bricolage Grotesque"; letter-spacing: -.03em; }
  .brand img { width: 56px; height: 56px; display: block; }
  h1 { margin-top: 34px; font: 700 60px/1.02 "Bricolage Grotesque"; white-space: nowrap; letter-spacing: -.04em; }
  h1 em { font-style: normal; color: #5db6d2; }
  .copy p { margin-top: 24px; font-size: 26px; line-height: 1.4; color: #b4c8c7; }
  .pill { display: inline-block; margin-top: 28px; padding: 7px 16px; border: 1px solid #2f5561; border-radius: 999px; background: rgba(17, 37, 44, .8); font: 500 15px/1.4 "IBM Plex Mono"; letter-spacing: .1em; color: #5db6d2; }

  .win { border: 1px solid #21404a; border-radius: 16px; overflow: hidden; background: #11252c; box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .8); }
  .bar { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 16px; border-bottom: 1px solid #21404a; font-size: 16px; font-weight: 600; }
  .lights { display: flex; gap: 8px; }
  .lights i { width: 13px; height: 13px; border-radius: 50%; background: #ff5f57; }
  .lights i:nth-child(2) { background: #febc2e; }
  .lights i:nth-child(3) { background: #28c840; }
  .bar .grow { flex: 1; }
  .seg { display: flex; gap: 2px; padding: 3px; border: 1px solid #21404a; border-radius: 999px; background: #0a171c; font: 500 13px/1 "IBM Plex Mono"; color: #88a2a2; }
  .seg span { padding: 6px 11px; border-radius: 999px; }
  .seg .on { background: #11252c; color: #e2eeec; }
  .main { padding: 20px 22px 18px; }
  .main h3 { font: 700 28px/1 "Bricolage Grotesque"; letter-spacing: -.02em; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .kpi { padding: 12px 14px; border-radius: 10px; background: #0a171c; }
  .kpi .l { font-size: 14px; color: #88a2a2; }
  .kpi .v { font: 700 30px/1.15 "Bricolage Grotesque"; letter-spacing: -.02em; }
  .kpi .d { font: 500 13px/1.4 "IBM Plex Mono"; color: #5cc594; }
  svg { display: block; width: 100%; margin-top: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="copy">
    <div class="brand"><img src="../assets/icon.png" alt="">Graphley</div>
    <h1>Every site and app.<br><em>One calm chart.</em></h1>
    <p>Analytics for your Mac. Free, local-first, set up by your agents.</p>
    <div class="pill">GRAPHLEY.AI</div>
  </div>
  <div class="win">
    <div class="bar"><span class="lights"><i></i><i></i><i></i></span>Graphley<span class="grow"></span><span class="seg"><span>7D</span><span class="on">30D</span><span>90D</span></span></div>
    <div class="main">
      <h3>All sites</h3>
      <div class="kpis">
        <div class="kpi"><div class="l">Visitors</div><div class="v">6,284</div><div class="d">▲ 14%</div></div>
        <div class="kpi"><div class="l">App downloads</div><div class="v">198</div><div class="d">▲ 31%</div></div>
        <div class="kpi"><div class="l">Key events</div><div class="v">281</div><div class="d">▲ 9%</div></div>
      </div>
      <svg id="chart" viewBox="0 0 560 168"></svg>
    </div>
  </div>
</div>
<script>
  // Sample curves only, one per made-up site.
  var colors = ['#5db6d2', '#59c9bf', '#e3a45a', '#a79ae0', '#e57f93'];
  var bases = [92, 58, 34, 26, 17], out = '';
  [40, 100, 160].forEach(function (y, i) { out += '<line x1="0" x2="560" y1="' + y + '" y2="' + y + '" stroke="#21404a" ' + (i < 2 ? 'stroke-dasharray="2 3"' : '') + '/>'; });
  bases.forEach(function (b, s) {
    var pts = [];
    for (var i = 0; i < 30; i++) {
      var v = b * (1 + 0.004 * i * (s === 2 ? 6 : 1)) * (1 + 0.13 * Math.sin((i + s * 5) / 3.1)) * ((i + 2) % 7 > 4 ? 0.78 : 1);
      pts.push([i * 560 / 29, 160 - v]);
    }
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    out += '<path d="' + line + ' L560 160 L0 160 Z" fill="' + colors[s] + '" opacity=".14"/><path d="' + line + '" fill="none" stroke="' + colors[s] + '" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  });
  document.getElementById('chart').innerHTML = out;
</script>
</body>
</html>
